<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Source Han Sans CN", sans-serif; }
    .num { font-family: "Barlow Condensed", -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
    .card { background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 4px rgba(20,24,33,.06) }
    .k { font-size: 12px; color: #7B8496 }
    .row { display: flex; align-items: center; gap: 10px; padding: 13px 14px }
    .row + .row { border-top: 1px solid #DFE2E9 }
    .row .t { flex: 1; font-size: 15px }
    .ar { color: #C3C8D2; font-size: 16px }
    .sect { font-size: 11px; color: #7B8496; letter-spacing: .12em; padding: 4px 4px 0 }
    .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #F5A524; color: #FFFFFF;
             font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center }
  </style>
</helmet>

<!-- 我的 tab。三层判据：顶＝身份，中＝带数字或状态的，底＝纯跳转入口。
     不这么分，组织者入口会沉到底。 -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F5F7; color: #141821; display: flex; flex-direction: column; font-size: 14px">

  <div style="flex: none; height: 88px; padding-top: 44px; background: #FFFFFF; border-bottom: 1px solid #DFE2E9; display: flex; align-items: center; justify-content: center; position: relative; font-size: 17px; font-weight: 600">
    我的
    <span style="position: absolute; right: 10px; width: 87px; height: 30px; border: 1px solid #DFE2E9; border-radius: 15px; display: flex; align-items: center; justify-content: space-evenly; color: #4C5567; font-size: 11px">
      <span>⋯</span><i style="width:1px;height:16px;background:#DFE2E9"></i><span>◉</span>
    </span>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">

    <!-- 第一层：身份 + 三个数字 -->
    <div class="card" style="padding: 14px">
      <div style="display: flex; align-items: center; gap: 11px">
        <div style="width: 46px; height: 46px; border-radius: 999px; background: #2E4FD8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600">张</div>
        <div style="flex: 1">
          <div style="font-size: 18px; font-weight: 600">张伟</div>
        </div>
        <div style="height: 28px; padding: 0 11px; border-radius: 999px; background: #EBEDF2; color: #4C5567; font-size: 12px; display: flex; align-items: center">编辑</div>
      </div>

      <!-- 三个数字并排。系统值没算出来显示「—」，绝不用自评顶替 -->
      <div style="display: flex; margin-top: 14px; padding-top: 13px; border-top: 1px solid #DFE2E9">
        <div style="flex: 1">
          <div class="k">积分</div>
          <div class="num" style="font-size: 26px; font-weight: 600; line-height: 1.2">1240</div>
        </div>
        <div style="width:1px;background:#DFE2E9;margin:2px 0"></div>
        <div style="flex: 1; padding-left: 14px">
          <div class="k">自评</div>
          <div class="num" style="font-size: 26px; font-weight: 600; line-height: 1.2">3.5</div>
        </div>
        <div style="width:1px;background:#DFE2E9;margin:2px 0"></div>
        <div style="flex: 1; padding-left: 14px">
          <div class="k">系统</div>
          <div class="num" style="font-size: 26px; font-weight: 600; line-height: 1.2; color: #C3C8D2">—</div>
        </div>
      </div>
    </div>

    <!-- 第二层：带数字或状态的，会变，所以要往上放 -->
    <div class="sect">进行中</div>
    <div class="card">
      <div class="row">
        <span class="t">我的报名</span>
        <span class="badge">2</span>
        <span class="ar">›</span>
      </div>
      <div class="row" style="display: {{orgShow}}">
        <span class="t">我管理的</span>
        <span class="badge">3</span>
        <span class="ar">›</span>
      </div>
    </div>

    <!-- 第三层：纯跳转，不带状态 -->
    <div class="card" style="margin-top: 2px">
      <div class="row"><span class="t">我的战绩</span><span class="k"><span class="num">18</span> 胜 <span class="num">7</span> 负</span><span class="ar">›</span></div>
      <div class="row"><span class="t">我的俱乐部</span><span class="k">{{clubText}}</span><span class="ar">›</span></div>
    </div>

    <div class="card">
      <div class="row"><span class="t">积分与赛制规则</span><span class="ar">›</span></div>
    </div>

    <!-- 没有俱乐部时给一句指路，不给按钮 —— 建俱乐部只在网页端 -->
    <div class="k" style="display: {{hintShow}}; line-height: 1.7; padding: 0 4px">
      想自己办赛？<b style="color:#4C5567">创建俱乐部在网页后台</b>，小程序这边只承接后续。
    </div>

  </div>

  <!-- tabBar 与赛事首页高保真同一套线性图标（design/home/Main.dc.html） -->
  <div style="flex: none; height: 68px; background: #FFFFFF; border-top: 1px solid #DFE2E9; display: flex; padding-bottom: 18px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#7B8496"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 5M17 6h3a3 3 0 0 1-3 5"/></svg>赛事</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#7B8496"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>积分</div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#2E4FD8;font-weight:600"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"role":{"editor":"enum","options":["普通选手","俱乐部管理员"],"default":"俱乐部管理员","section":"身份"}}'>
class Component extends DCLogic {
  renderVals() {
    const org = this.props.role === '俱乐部管理员';
    return {
      // 「我管理的」只对俱乐部管理员显示，普通选手看不到这一行
      orgShow:  org ? 'flex' : 'none',
      hintShow: org ? 'none' : 'block',
      clubText: org ? '2 个' : '深圳网球会',
    };
  }
}
</script>
</body>
</html>
