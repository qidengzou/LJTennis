<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --w-bg:#FFFFFF; --w-line:#B4B4AE; --w-line2:#D6D6D0;
      --w-fill:#E8E8E4; --w-fill2:#DADAD4; --w-ink:#3A3A36; --w-ink3:#8E8E86;
      --ink:#1C1C1A; --ink-2:#55554F; --ink-3:#8A8A82; --ann:#B03A2E;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:14px;background:#F2F2F0;color:var(--ink);
      font-family:"IBM Plex Mono","PingFang SC",ui-monospace,monospace;line-height:1.45}
    a{color:#B03A2E}a:hover{color:#8A2D23}
    .utitle{font-size:13px;font-weight:600;margin:0 0 2px;color:var(--ink)}
    .usub{font-size:11px;color:var(--ink-3);margin:0 0 10px}
    .phone{width:345px;border:1px solid var(--w-line);background:var(--w-bg);
      color:var(--w-ink);font-size:12px;overflow:hidden}
    .pnav{height:42px;border-bottom:1px solid var(--w-line);display:flex;align-items:center;
      justify-content:space-between;padding:0 10px;gap:8px}
    .cap{width:78px;height:27px;border:1px dashed var(--w-line);border-radius:14px;font-size:8px;
      display:grid;place-items:center;color:var(--w-ink3);flex:none}
    .pbody{padding:11px;display:flex;flex-direction:column;gap:9px}
    .ptab{display:flex;border-top:1px solid var(--w-line);background:var(--w-fill)}
    .ptab span{flex:1;text-align:center;padding:8px 0;font-size:10px;color:var(--w-ink3);
      border-right:1px solid var(--w-line2)}
    .ptab span:last-child{border-right:0}
    .ptab span.on{color:var(--w-ink);background:var(--w-fill2)}
    .seg{display:flex;border:1px solid var(--w-line)}
    .seg span{flex:1;text-align:center;padding:6px 2px;font-size:10.5px;
      border-right:1px solid var(--w-line2);white-space:nowrap}
    .seg span:last-child{border-right:0}
    .seg span.on{background:var(--w-fill2)}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{border:1px solid var(--w-line2);padding:3px 9px;font-size:10px;border-radius:10px;color:var(--w-ink3)}
    .chip.on{border-color:var(--w-line);color:var(--w-ink);background:var(--w-fill)}
    .card{border:1px solid var(--w-line2);padding:9px 10px;display:flex;flex-direction:column;gap:6px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .mut{color:var(--w-ink3);font-size:10.5px}
    .big{font-size:14px}
    .btnw{border:1px solid var(--w-ink);text-align:center;padding:10px;font-size:12.5px;background:var(--w-fill)}
    .btnw.ghost{border-color:var(--w-line2);background:transparent;color:var(--w-ink3)}
    .hbar{height:1px;background:var(--w-line2)}
    .ph{background:var(--w-fill);height:9px}
    .sect{font-size:10px;color:var(--w-ink3);letter-spacing:.08em;padding-top:2px}
    .badge{border:1px solid var(--w-ink);border-radius:999px;min-width:17px;height:17px;padding:0 5px;
      font-size:9.5px;display:grid;place-items:center;background:var(--w-fill2);flex:none}
    .inp{border:1px solid var(--w-line2);padding:8px 9px;font-size:11px;color:var(--w-ink3)}
    .num{border:1px solid var(--w-line);width:38px;height:32px;display:grid;place-items:center;font-size:14px}
    .a{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:999px;
      border:1px solid var(--ann);color:var(--ann);font-size:8.5px;flex:none}
    .anns{margin:11px 0 0;padding:0;list-style:none;display:grid;gap:5px}
    .anns li{font-size:11.5px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}
    .anns li > b{flex:none;width:15px;height:15px;border-radius:999px;border:1px solid var(--ann);
      color:var(--ann);font-size:9px;display:grid;place-items:center;margin-top:2px;font-weight:400}
  </style>
</helmet>
<p class="utitle">改比分 · org/match</p>
<p class="usub">主包页面 —— 组织者也站在球场边</p>
<div class="phone">
  <div class="pnav"><span>‹ 场次 12</span><div class="cap">胶囊</div></div>
  <div class="pbody">
    <div class="card">
      <div class="row"><span class="big">张伟 / 李强</span><span class="mut">A 组</span></div>
      <div class="row"><span class="big">王芳 / 赵敏</span><span class="mut">4月13日 14:00</span></div>
    </div>
    <div class="sect">局分</div>
    <div class="row"><span class="mut">第一盘</span>
      <div style="display:flex;gap:8px;align-items:center"><div class="num">6</div><span class="mut">–</span><div class="num">4</div></div></div>
    <div class="row"><span class="mut">第二盘</span>
      <div style="display:flex;gap:8px;align-items:center"><div class="num">3</div><span class="mut">–</span><div class="num">6</div></div></div>
    <div class="row"><span class="mut">第三盘</span>
      <div style="display:flex;gap:8px;align-items:center"><div class="num">7</div><span class="mut">–</span><div class="num">6</div></div></div>
    <div class="row"><span class="mut">　抢七</span>
      <div style="display:flex;gap:8px;align-items:center"><div class="num">7</div><span class="mut">–</span><div class="num">5</div></div></div>
    <div class="hbar"></div>
    <div class="card">
      <div class="row"><span class="mut">选手提交的原值</span><span class="mut">6-4 3-6 7-6⁽⁷⁻⁵⁾</span></div>
    </div>
    <div class="btnw">保存</div>
    <div class="btnw ghost">判定为无效场次</div>
  </div>
</div>
<ul class="anns">
  <li><b>1</b><span>只有局分，没有逐分 —— MatchScore 模型本就不存逐分数据，所以这屏很轻。</span></li>
  <li><b>2</b><span>选手提交的原值保留可见，便于对照，改错了能看出差在哪。</span></li>
  <li><b>3</b><span>保存后要记录操作人与时间，签表上标「已由组织者修正」。</span></li>
  <li><b>4</b><span>数字框 38×32，够球场边单手点。</span></li>
</ul>
</x-dc>
</body>
</html>
